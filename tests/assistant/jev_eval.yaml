# Evaluation set for the typed reading of a question (Jev and the lexical floor), 25 questions.
# Written on 2026-11-14 BEFORE any run; the expected readings are not to be tuned after seeing results.
# Run: .venv\Scripts\python.exe -X utf8 -m tests.assistant.jev_eval   (Jev needs TYPESAFE_API_KEY; costs a fraction
# of a cent for the whole set)
#
# expect:
#   designs: the correct kinds of answer; the first is the best one, any of them counts as right.
#   subjects: the subjects (understand.SUBJECTS) the question is about; [] when none.
#   shortlist: catalog variables that must be in the prefilter's full entries (the planner needs their detail).
#   time: kind of the time reference (point, since, range, future, episode, recent) or null when there is none.
#   place: the question names a place (true/false), wherever it is.
#   in_scope: Delfos's informants could answer it (a place on Earth, a subject of the catalog).
#   size: the question states a size with its unit.

cases:
  - id: J01
    language: es
    text: "¿Está subiendo la temperatura en Ontinyent?"
    expect: {designs: [trend], subjects: [heat], shortlist: [air_temperature], time: null, place: true,
             in_scope: true, size: false}
  - id: J02
    language: es
    text: "¿Cuánto calor hará en Valencia en 2050?"
    expect: {designs: [scenario], subjects: [heat], shortlist: [tas_mean], time: future, place: true,
             in_scope: true, size: false}
  - id: J03
    language: es
    text: "¿Qué ha cambiado en Paiporta desde la DANA de 2024?"
    expect: {designs: [impact, trend], subjects: [rain, flood], shortlist: [], time: since, place: true,
             in_scope: true, size: false}
  - id: J04
    language: es
    text: "¿Cómo de excepcional fue la lluvia de octubre de 2024 en Algemesí?"
    expect: {designs: [event], subjects: [rain], shortlist: [precipitation], time: point, place: true,
             in_scope: true, size: false}
  - id: J05
    language: es
    text: "¿Cuánta gente vive en zona inundable en Catarroja?"
    expect: {designs: [exposure], subjects: [flood, population], shortlist: [population_in_flood_area], time: null,
             place: true, in_scope: true, size: false}
  - id: J06
    language: es
    text: "¿Qué pasa si se construyen 5.000 viviendas en Sagunto?"
    expect: {designs: [whatif], subjects: [building], shortlist: [], time: null, place: true, in_scope: true,
             size: true}
  - id: J07
    language: en
    text: "How many people live in flood-prone areas in Lyon, France?"
    expect: {designs: [exposure], subjects: [flood, population], shortlist: [population_in_flood_area], time: null,
             place: true, in_scope: true, size: false}
  - id: J08
    language: es
    text: "¿Cómo está la vegetación en Torrent este año?"
    expect: {designs: [state], subjects: [vegetation], shortlist: [ndvi], time: recent, place: true,
             in_scope: true, size: false}
  - id: J09
    language: es
    text: "Dame un panorama general del clima en Gandia"
    expect: {designs: [scan, state], subjects: [], shortlist: [], time: null, place: true, in_scope: true,
             size: false}
