[project]
name = "habitat-under-pressure"
version = "0.1.0"
description = "Habitat Under Pressure: workspace root"
requires-python = ">=3.12,<3.13"
dependencies = ["hup-data", "hup-ops", "hup-api"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/hup_data", "packages/hup_ops", "apps/api"]

[tool.uv.sources]
hup-data = { workspace = true }
hup-ops = { workspace = true }
hup-api = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "httpx>=0.27",
    "httpx2>=2.16.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["exploracion", ".dev", "docs", "data", "apps/web", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["hup_data", "hup_ops", "hup_api"]

[tool.pytest.ini_options]
testpaths = ["packages", "apps/api/tests", "tests"]
addopts = "--import-mode=importlib"
markers = ["data: needs files under HUP_DATA_DIR; skipped when they are missing"]
