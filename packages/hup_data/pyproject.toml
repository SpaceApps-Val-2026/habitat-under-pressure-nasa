[project]
name = "hup-data"
version = "0.1.0"
description = "Store, coverage index, place resolution and readers (front A, data)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2",
  "pandas>=2.2",
  "xarray>=2024.10",
  "zarr>=2.18",
  "dask>=2024.10",
  "netCDF4>=1.7",
  "h5netcdf>=1.4",
  "h5py>=3.12",
  "rasterio>=1.4",
  "rioxarray>=0.17",
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyproj>=3.7",
  "pyarrow>=17",
  "duckdb>=1.1",
  "pypdf>=5",
  "pystac-client>=0.8",
  "planetary-computer>=1.0",
  "requests>=2.32",
  "jsonschema>=4.23",
  "python-dotenv>=1.0",
  "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hup_data"]
