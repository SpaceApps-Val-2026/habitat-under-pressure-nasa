    - baseline
  output:
    type: series
    data_class: inherit
  limits:
  - en: Requires comparable observations at the declared spatial support.
  evidence_level: E0
  diagnostics:
  - n_baseline_dates
- id: trend
  version: '1.2'
  type: compute
  visual_type: compute
