  - correction
  - interval_crosses_zero
- id: scan_trends
  version: '1.2'
  type: compute
  visual_type: compute
  phrase:
    en: Calculating scan trends
    es: Calculando el barrido de tendencias
  params:
    type: object
    properties:
      min_years:
        type: integer
        minimum: 3
        default: 9
      alpha:
        type: number
        exclusiveMinimum: 0
        exclusiveMaximum: 1
        default: 0.05
  output:
    type: table
    data_class: inherit
  limits:
  - en: Requires comparable observations at the declared spatial support.
  evidence_level: E1
  diagnostics:
  - n_tests
  - n_significant_raw
  - n_significant_adjusted
  - correction
  - n_years
  - autocorrelation_lag1
  - interval_crosses_zero
  - multiple_test_correction

- id: distance_decay
  version: '1.1'
  type: compute
  visual_type: compute
  phrase:
    en: Calculating distance decay
    es: Calculando la atenuación con la distancia
  params:
    type: object
    properties:
      min_dates:
        type: integer
        default: 3
        minimum: 3
      confidence:
        type: number
        exclusiveMinimum: 0
        exclusiveMaximum: 1
        default: 0.95
      resamples:
        type: integer
        default: 2000
        minimum: 1
      alpha:
        type: number
        exclusiveMinimum: 0
        exclusiveMaximum: 1
        default: 0.05
      before:
        type: array
        minItems: 2
        maxItems: 2
        items:
          anyOf:
          - type: integer
          - type: string
            format: date
      after:
        type: array
        minItems: 2
        maxItems: 2
        items:
          anyOf:
          - type: integer
          - type: string
            format: date
      bands_m:
        type: array
        items:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: number
            minimum: 0
    required:
    - before
    - after
  output:
    type: table
    data_class: inherit
  limits:
  - en: Requires comparable observations at the declared spatial support.
  evidence_level: E2
  diagnostics:
  - n_dates
  - pre_trend_control
  - interval_crosses_zero
- id: break_year
  version: '1.0'
  type: compute
  visual_type: compute
  phrase:
    en: Calculating break year
    es: Buscando el año del cambio
  params:
    type: object
    properties:
      min_dates:
        type: integer
        default: 4
        minimum: 2
      confidence:
        type: number
        exclusiveMinimum: 0
        exclusiveMaximum: 1
        default: 0.95
      resamples:
        type: integer
        default: 2000
        minimum: 1
  output:
    type: value
    data_class: inherit
  limits:
  - en: Requires comparable observations at the declared spatial support.
  evidence_level: E2
  diagnostics:
  - n_years
- id: placebo_test
  version: '1.1'
  type: compute
  visual_type: compute
  phrase:
    en: Calculating placebo test
    es: Ejecutando la prueba placebo
  params:
    type: object
    properties:
      confidence: {type: number, exclusiveMinimum: 0, exclusiveMaximum: 1, default: 0.95}
      resamples: {type: integer, minimum: 1, default: 2000}
      before:
        type: array
        minItems: 2
        maxItems: 2
        items:
          anyOf:
          - type: integer
          - type: string
            format: date
      after:
        type: array
        minItems: 2
        maxItems: 2
        items:
          anyOf:
          - type: integer
          - type: string
            format: date
      min_dates:
        type: integer
        default: 3
        minimum: 3
      min_controls:
        type: integer
        default: 20
        minimum: 0
      control_criteria:
        type: string
        minLength: 1
      false_events:
        type: array
        items:
          type: object
          required:
          - before
          - after
          properties:
            before:
              type: array
              minItems: 2
              maxItems: 2
              items:
                anyOf:
                - type: integer
                - type: string
                  format: date
            after:
              type: array
              minItems: 2
              maxItems: 2
              items:
                anyOf:
                - type: integer
                - type: string
                  format: date
    required:
    - before
    - after
    - control_criteria
  output:
    type: value
    data_class: inherit
  limits:
  - en: Requires comparable observations at the declared spatial support.
  evidence_level: E2
  diagnostics:
  - n_controls
  - control_criteria
  - n_false_events

- id: climate_delta
  version: '1.4'
  type: compute
  visual_type: compute
  phrase:
    en: Calculating climate delta
    es: Calculando el cambio climático proyectado
  params:
    type: object
    properties:
      reference_variable:
        description: Explicitly matched observed indicator with equivalent meaning and units. Defaults to the modeled variable.
        type: string
      reference_min_years:
        description: Minimum contiguous observed years for a shared shortened baseline; a requested reference shorter than this has to be complete. Null requires the full baseline. 17 lets a record that starts in 1998, such as IMERG, use 1998-2014 (Guillem, 14 November).
        type: [integer, 'null']
        minimum: 1
        default: 17
      reference:
        type: array
        minItems: 2
        maxItems: 2
        items:
          type: integer
        default:
        - 1995
        - 2014
      windows:
        type: object
        patternProperties:
          ^[0-9]{4}$:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: integer
        additionalProperties: false
        default:
          '2030':
          - 2025
          - 2034
          '2040':
          - 2035
          - 2044
          '2050':
          - 2045
          - 2054
      scenario_pairs:
        type: object
        additionalProperties:
          type: string
        default:
          ssp1: ssp126
          ssp2: ssp245
          ssp3: ssp370
          ssp5: ssp585
      population_scenarios:
        type: array
        items:
          type: string
      min_coverage:
        type: number
        exclusiveMinimum: 0
        maximum: 1
        default: 1
  output:
    type: series
    data_class: extrapolated
  limits:
  - en: Requires comparable inputs and adequate coverage.
  evidence_level: E0
  diagnostics:
  - n_models
  - models
- id: uncertainty_split
  version: '1.1'
  type: compute
  visual_type: compute
  phrase:
    en: Calculating uncertainty split
    es: Desglosando la incertidumbre
  params:
    type: object
    properties: {}
  output:
    type: table
    data_class: extrapolated
  limits:
  - en: Requires comparable inputs and adequate coverage.
  evidence_level: E0
  diagnostics:
  - n_models
  - models
- id: project_trend
  version: '1.0'
  type: compute
  visual_type: compute
  phrase:
    en: Calculating project trend
    es: Proyectando la tendencia
  params:
    type: object
    properties:
      variable_kind:
        const: non_climate
      horizons:
        type: array
        items:
          type: integer
        default:
        - 2030
        - 2040
        - 2050
      min_years:
        type: integer
        minimum: 3
        default: 10
      confidence:
        type: number
        exclusiveMinimum: 0
        exclusiveMaximum: 1
        default: 0.95
    required:
    - variable_kind
  output:
    type: series
    data_class: extrapolated
  limits:
  - en: Requires comparable inputs and adequate coverage.
  evidence_level: E0
  diagnostics: []

- id: lagged_association
  version: '1.2'
  type: compute
  visual_type: compute
  phrase:
    en: Calculating lagged association
    es: Calculando la asociación con desfase temporal
  params:
    type: object
    properties:
      weather_hypotheses:
        description: The two meteorological pairs approved provisionally by Claude at Iban's request.
        const:
        - id: summer_rain_and_daily_highs
          precipitation: precipitation
          temperature: air_temperature_max
          season: summer
          negative: true
          rationale: Lower summer rain and warmer daily highs can occur together through land-atmosphere coupling.
          reference: https://doi.org/10.1073/pnas.1204330109
        - id: annual_rain_and_mean_temperature
          precipitation: precipitation
          temperature: air_temperature
          season: null
          negative: false
          rationale: Annual rainfall and annual mean temperature may vary together in either direction.
      min_years:
        type: integer
        minimum: 5
        default: 15
      block_years:
        type: integer
        minimum: 1
        default: 3
      resamples:
        type: integer
        minimum: 20
        default: 999
      alpha:
        type: number
        exclusiveMinimum: 0
        exclusiveMaximum: 1
        default: 0.05
      allow_regional_gaps:
        description: Allow one gap of up to two consecutive years in the regional control of the same-summer
          NDVI–LST test with verified complete summers and the default resampling and significance settings.
        type: boolean
      regional:
        type: string
      from:
        type: string
      to:
        type: string
      lags:
        type: array
        minItems: 1
        items:
          type: integer
          minimum: 0
        default:
        - 0
  output:
    type: table
    data_class: inherit
  limits:
  - en: Requires comparable inputs and adequate coverage.
  evidence_level: E3
  diagnostics:
  - n_effective
  - lags_tested
  - detrended
  - p_adjusted
- id: evaluate_chain
  version: '1.4'
  type: compute
  visual_type: compute
  phrase:
    en: Checking the links in the evidence chain
    es: Comprobando los eslabones de la cadena de evidencia
  params:
    type: object
    properties:
      min_years:
        type: integer
        minimum: 5
        default: 15
      block_years:
        type: integer
        minimum: 1
        default: 3
      resamples:
        type: integer
        minimum: 20
        default: 999
      alpha:
        type: number
        exclusiveMinimum: 0
        exclusiveMaximum: 1
        default: 0.05
      regional:
        type: string
        regional_ring:
          description: Inner and outer distance from the site for the regional control, in kilometres.
          type: array
          minItems: 2
          maxItems: 2
          items: {type: number, minimum: 0}
      chain:
        type: object
        required:
        - id
        - links
        properties:
          id:
            type: string
          links:
            type: array
            minItems: 1
            items:
              type: object
              required:
              - from
              - to
              - sign
              - ref
              properties:
                from:
                  type: string
                to:
                  type: string
                sign:
                  enum:
                  - +
                  - '-'
                ref:
                  type:
                  - string
                  - 'null'
                lag_years:
                  type: array
                  minItems: 2
                  maxItems: 2
                  items:
                    type: integer
                    minimum: 0
    required:
    - chain
  output:
    type: table
    data_class: inherit
  limits:
  - en: Requires comparable inputs and adequate coverage.
  evidence_level: E5
  diagnostics: []

- id: rain_extreme
  version: '1.0'
  type: compute
  visual_type: compute
  phrase:
    en: Comparing equivalent monthly windows
    es: Comparando periodos mensuales equivalentes
  params:
    type: object
    required:
    - year
    - months
    properties:
      year:
        type: integer
        minimum: 1
        maximum: 9999
      months:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: integer
          minimum: 1
          maximum: 12
      min_years:
        type: integer
        minimum: 1
        default: 20
  output:
    type: value
    data_class: inherit
  evidence_level: E0
  diagnostics:
  - n_years
  - rank
- id: same_date_anomaly
  version: '1.0'
  type: compute
  visual_type: compute
  phrase:
    en: Comparing equivalent monthly windows
    es: Comparando periodos mensuales equivalentes
  params:
    type: object
    required:
    - year
    - months
    properties:
      year:
        type: integer
        minimum: 1
        maximum: 9999
      months:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: integer
          minimum: 1
          maximum: 12
      min_years:
        type: integer
        minimum: 1
        default: 20
  output:
    type: value
    data_class: inherit
  evidence_level: E0
  diagnostics:
  - n_years
- id: return_level
  version: '1.2'
  type: compute
  visual_type: compute
  phrase:
    en: Fitting the annual maxima
    es: Ajustando los máximos anuales
  params:
    type: object
    properties:
      return_periods:
        description: Years for which the level exceeded on average once in that time is given; a period longer
          than the record is not estimated.
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: integer
          minimum: 2
        default: [2, 5, 10, 25]
      event_year:
        description: Optional. The year of an episode, set against the years before it, which are also the only
          ones fitted. With a second input, the daily series of the episode (dates YYYY-MM-DD), the value of the
          episode is its wettest day; without it, the value of that year in the annual series.
        type: integer
        minimum: 1
        maximum: 9999
      min_years:
        type: integer
        minimum: 3
        default: 20
      resamples:
        type: integer
        minimum: 99
        default: 999
      confidence:
        type: number
        exclusiveMinimum: 0
        exclusiveMaximum: 1
        default: 0.95
  output:
    type: value
    data_class: inherit
  limits:
  - en: Requires one annual series of maxima, and for an episode optionally its daily series; a zone mean is lower
      than the maximum of its wettest point.
    es: Necesita una serie anual de máximos y, para un episodio, opcionalmente su serie diaria; la media de una zona
      es menor que el máximo de su punto más extremo.
  evidence_level: E0
  diagnostics:
  - n_years
  - location
  - scale
  - shape
  - max_observed
  - return_period_years
  - event_year
  - event_value
  - event_day
  - record_level

- id: zone_layer
  version: '1'
  type: ingest
  visual_type: satellite
  phrase:
    en: Preparing map layers for the area
    es: Preparando las capas del mapa de la zona
  params:
    type: object
    required: [variable]
    additionalProperties: false
    properties:
      variable:
        type: string
      source:
        enum: [imerg-monthly, nex-gddp-cmip6, landsat-c2-l2]
      period:
        type: object
        required: [start, end]
        additionalProperties: false
        properties:
          start: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
          end: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
          months:
            type: array
            items: {type: integer, minimum: 1, maximum: 12}
      scenario:
        enum: [ssp126, ssp245, ssp370, ssp585]
  output:
    type: layer
    data_class: inherit
- id: read_exposure
  version: '1.1'
  type: ingest
  visual_type: satellite
  phrase:
    en: Aligning population and the applicable flood map
    es: Alineando la población y el mapa de inundación aplicable
  params:
    type: object
    required: [variable, grid, flood_layers]
    additionalProperties: false
    properties:
      variable:
        const: population_in_flood_area
      grid:
        type: object
        required: [source, year, url]
        additionalProperties: false
        properties:
          source: {const: ghsl}
          year: {type: integer}
          url: {type: string, format: uri}
        default:
          source: ghsl
          year: 2025
          url: https://doi.org/10.1080/17538947.2024.2390454
      flood_layers:
        type: array
        items:
          type: object
          required: [source, kind, start, masks, url]
          additionalProperties: false
          properties:
            source: {type: string}
            url: {type: string, format: uri}
            version: {type: string}
            kind: {enum: [observed, hazard]}
            start: {type: string, format: date}
            end: {type: string, format: date}
            masks: {type: array, minItems: 1, items: {type: string}}
            return_years: {type: integer, minimum: 1}
            coverage: {type: string}
            coverage_url: {type: string, format: uri}
            coverage_filter: {type: object}
            mask_filter: {type: object}
            category:
              enum: [flooded_area, flood_trace]
          dependentRequired:
            coverage: [coverage_url]
          allOf:
          - if:
              properties:
                kind: {const: hazard}
            then:
              required: [return_years, coverage]
        default:
        - source: copernicus-ems-emsr773
          url: https://mapping.emergency.copernicus.eu/activations/EMSR773/
          version: DEL v1
          kind: observed
          start: '2024-10-29'
          end: '2024-10-29'
          masks: ['*DEL_PRODUCT*__*observedEventA*']
          mask_filter: {event_type: 5-Flood, notation: Flooded area}
          category: flooded_area
        - source: copernicus-ems-emsr773
          url: https://mapping.emergency.copernicus.eu/activations/EMSR773/
          version: DEL v1
          kind: observed
          start: '2024-10-29'
