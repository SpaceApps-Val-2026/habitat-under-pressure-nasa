# operations: one entry per item. Shape: docs/contratos/catalog.schema.json, property "operations".
# Starting point copied from docs/contratos/examples/catalog.json; build with python -m hup_api.catalog build
- id: read_series
  version: '1.2'
  type: ingest
  visual_type: satellite
  phrase:
    en: Reading {n} scenes from {source}
    es: Leyendo {n} escenas de {source}
  params:
    type: object
    required:
    - variable
    properties:
      variable:
        type: string
      read_period:
        description: Per-step date range for comparing separately read reference and projection series.
        type: object
        additionalProperties: false
        required: [start, end]
        properties:
          start: {type: string, format: date}
          end: {type: string, format: date}
          months:
            type: array
            items: {type: integer, minimum: 1, maximum: 12}
      max_cloud_pct:
        type: number
      aggregate:
        description: none keeps every date; year gives one value per year
        enum:
        - none
        - year
        default: none
      statistic:
        description: How the values of a year are combined; month_balanced weighs every month the same, for
          satellite scenes that arrive unevenly by month
        enum:
        - mean
        - sum
        - median
        - month_balanced
        default: mean
      season:
        description: Read only the months of this season at the zone (summer is June to September in the north
          and December to March in the south); a season across the new year counts in the year it ends
        enum:
        - summer
      min_count:
        description: Values a year needs to count; a shorter year is dropped, never
          padded
        type: integer
        minimum: 1
        default: 1
      require_complete_months:
        description: For annual aggregation, require a valid observation in every selected month of the season
          (all twelve months when no months are selected).
        type: boolean
      hypothesis_power_cell:
        description: Reduce the two provisional meteorological pairs on their common native POWER cell.
        const: true
      area:
        enum:
        - zone
        - reference
        - ring
        default: zone
      reference_km:
        type: number
        exclusiveMinimum: 0
        default: 3
      reference_inner_km:
        description: With area reference, read only the outer ring from this distance to reference_km from the edge
          of the zone (the disc inside is not read); absent, the reference is everything within reference_km.
        type: number
        exclusiveMinimum: 0
      land_only:
        description: Leave out permanent water (JRC Global Surface Water) in the Landsat zone medians; ignored, and
          said in a limit, for other sources. Absent means false (no default here, so existing plans keep their
          fingerprint).
        type: boolean
      percentile:
        description: Percentile of the base period that sets a threshold, for the readers that take one (hot cells);
          ignored by the others. Absent changes nothing (no default here, so existing plans keep their fingerprint).
        type: number
        exclusiveMinimum: 0
        exclusiveMaximum: 100
      base_period:
        description: Date range whose values set the threshold with percentile, for the readers that take one; its
          months default to those of the read. Absent changes nothing (no default here).
        type: object
        additionalProperties: false
        required: [start, end]
        properties:
          start: {type: string, format: date}
          end: {type: string, format: date}
          months:
            type: array
            items: {type: integer, minimum: 1, maximum: 12}
      ring_km:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: number
          exclusiveMinimum: 0
        default:
        - 1
        - 2
        - 3
      ring_index:
        description: Read only this zero-based annulus from the declared edges.
        type: integer
        minimum: 0
      grid_resolution_m:
        description: Nominal common pixel size in metres for a paired Landsat reading.
        type: integer
        minimum: 1
      grid_min_years:
        description: Minimum years for the intended comparison. Skip opening pixels when coverage cannot reach it.
        type: integer
        minimum: 1
  output:
    type: series
    data_class: inherit
  limits:
  - en: A year with fewer values than required is left out of the series.
    es: Un año con menos valores de los exigidos queda fuera de la serie.
  evidence_level: E0
  diagnostics:
  - threshold_c
  - threshold_percentile
  - threshold_base_start
  - threshold_base_end
  - threshold_n_values
- id: baci_contrast
  version: '1.1'
  type: compute
  visual_type: compute
  phrase:
    en: Comparing the site with its surroundings, before and after
    es: Comparando la zona con su entorno, antes y después
  params:
    type: object
    required:
    - variable
    - before
    - after
    properties:
      variable:
        type: string
      before:
        type: array
        minItems: 2
        maxItems: 2
        items:
          anyOf:
          - type: integer
          - type: string
            format: date
      after:
        type: array
        minItems: 2
        maxItems: 2
        items:
          anyOf:
          - type: integer
          - type: string
            format: date
      reference_km:
        type: number
        exclusiveMinimum: 0
        default: 3
      min_dates:
        type: integer
        default: 3
        minimum: 3
      confidence:
        type: number
        exclusiveMinimum: 0
        exclusiveMaximum: 1
        default: 0.95
      resamples:
        type: integer
        default: 2000
        minimum: 1
      alpha:
        type: number
        exclusiveMinimum: 0
        exclusiveMaximum: 1
        default: 0.05
  output:
    type: value
    data_class: inherit
  limits:
  - en: Coincides in time and place; does not prove cause.
    es: Coincide en tiempo y lugar; no prueba la causa.
  evidence_level: E2
  diagnostics:
  - n_dates
  - interval_crosses_zero
  - pre_trend_control
- id: write_findings
  version: '1.0'
  type: write
  visual_type: document
  phrase:
    en: Writing the findings
    es: Redactando los hallazgos
  params:
    type: object
  output:
    type: document
    data_class: measured
- id: review_findings
  version: '1.0'
  type: review
  visual_type: document
  phrase:
    en: Checking every figure against its result
    es: Comprobando cada cifra contra su resultado
  params:
    type: object
  output:
    type: table
    data_class: measured

- id: anomaly
