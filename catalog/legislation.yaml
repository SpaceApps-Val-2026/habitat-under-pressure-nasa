# legislation: explained EU acts, citizen routes, disclaimer, visibility by CELEX and the "Coming soon" text.
# Proposal: .dev/notes/2026-11-14-leyes-explicadas-vias-ciudadanas.md; decisions: .dev/notes/2026-11-14-cierre-normativa.md.
# Not read by hup_api.catalog yet (FILES does not include it) and without a schema in docs/contratos: request to B9.
# An act joins a card by `celex` or by `also_for`. `who`: anyone | interested | affected | ngo.
# A card without `reviewed_by` must not be shown in production; it falls back to its title.

who_labels:
  anyone: {es: "Cualquier persona", en: "Anyone"}
  interested: {es: "Quien tenga un derecho o interés legítimo", en: "People with a right or legitimate interest"}
  affected: {es: "Personas que han sufrido el daño", en: "People who suffered the harm"}
  ngo: {es: "Asociaciones ambientales", en: "Environmental associations"}

disclaimer:
  es: "Esta sección resume normas que tratan el mismo tema que los datos y las vías que la ley ofrece a cualquier persona. Es información general, no asesoramiento jurídico ni un dictamen. La aplicación no dice si alguien cumple o incumple una norma. Para un caso concreto, consulta a un profesional o a la administración competente."
  en: "This section summarises laws on the same subject as the data and the routes the law gives anyone. It is general information, not legal advice or a legal opinion. The app does not say whether anyone complies with or breaches a law. For a specific case, consult a professional or the competent authority."

acts:
  - celex: 32007L0060
    eurovoc: ['1440']  # EuroVoc concepts of Sara's query of 14 Nov: the sheet without network
    short_name: {es: "Directiva de Inundaciones", en: "Floods Directive"}
    plain:
      es: "Obliga a cada país a hacer mapas de zonas inundables y planes para reducir el riesgo de inundación, y a ponerlos a disposición de todo el mundo."
      en: "Requires each country to map flood-prone areas, make plans to reduce flood risk, and make both available to everyone."
    in_spain:
      es: "Real Decreto 903/2010, de evaluación y gestión de riesgos de inundación (BOE-A-2010-11184). Los mapas están en el Sistema Nacional de Cartografía de Zonas Inundables (SNCZI)."
      en: "Royal Decree 903/2010 on flood risk assessment and management (BOE-A-2010-11184). Maps are published in the National Flood Zone Mapping System (SNCZI)."
    citizen_options:
      - action: {es: "Consultar si un lugar está en zona inundable.", en: "Check whether a place lies in a flood-prone area."}
        how: {es: "Visor del SNCZI del Ministerio para la Transición Ecológica.", en: "SNCZI viewer of the Ministry for the Ecological Transition."}
        who: anyone
        legal_basis: "Directiva 2007/60/CE, art. 10.1; RD 903/2010, art. 10.3"
        url: "https://www.miteco.gob.es/es/agua/temas/gestion-de-los-riesgos-de-inundacion/snczi.html"
      - action: {es: "Presentar alegaciones a los mapas de peligrosidad y riesgo y al plan de gestión del riesgo de inundación cuando se revisan.", en: "Comment on flood hazard and risk maps and on the flood risk management plan when they are revised."}
        how: {es: "En la consulta pública de la confederación hidrográfica (en Valencia, la del Júcar); al menos tres meses.", en: "In the public consultation run by the river basin authority (in Valencia, the Júcar); at least three months."}
        who: anyone
        legal_basis: "RD 903/2010, arts. 10.2 y 13.3; Directiva 2007/60/CE, art. 10.2"
        url: "https://www.miteco.gob.es/es/agua/temas/gestion-de-los-riesgos-de-inundacion/planes-gestion-riesgos-inundacion.html"
    general: [access_info, public_comment, report_to_authority, appeal, ngo_action, defensor, sindic, eu_complaint, ep_petition]
    sources:
      - "http://publications.europa.eu/resource/celex/32007L0060"
      - "https://www.boe.es/buscar/act.php?id=BOE-A-2010-11184"
      - "https://www.miteco.gob.es/es/agua/temas/gestion-de-los-riesgos-de-inundacion/snczi.html"
    reviewed_by: "Gaia (Claude), por delegación de Sara"

  - celex: 32000L0060
    eurovoc: ['3144', '609']  # EuroVoc concepts of Sara's query of 14 Nov: the sheet without network
    short_name: {es: "Directiva Marco del Agua", en: "Water Framework Directive"}
    plain:
      es: "Pide que ríos, lagos, acuíferos y costas estén en buen estado y que cada cuenca tenga un plan hidrológico que reparte el agua y fija medidas, revisado cada seis años con participación del público."
      en: "Requires rivers, lakes, groundwater and coasts to be in good condition, and each river basin to have a plan that allocates water and sets measures, reviewed every six years with public participation."
    in_spain:
      es: "Texto refundido de la Ley de Aguas (Real Decreto Legislativo 1/2001, BOE-A-2001-14276) y Reglamento de la Planificación Hidrológica (Real Decreto 907/2007, BOE-A-2007-13182). En el Júcar, el plan 2022-2027 es el Real Decreto 35/2023 (BOE-A-2023-3511)."
      en: "Consolidated Water Act (Royal Legislative Decree 1/2001, BOE-A-2001-14276) and Hydrological Planning Regulation (Royal Decree 907/2007, BOE-A-2007-13182). For the Júcar, the 2022-2027 plan is Royal Decree 35/2023 (BOE-A-2023-3511)."
    citizen_options:
      - action: {es: "Opinar sobre el plan hidrológico de tu cuenca cuando se revisa.", en: "Comment on your river basin plan when it is revised."}
        how: {es: "Consulta pública de la confederación hidrográfica, de al menos seis meses por documento.", en: "Public consultation by the river basin authority, at least six months per document."}
        who: anyone
        legal_basis: "RD 907/2007, arts. 72 a 75; Directiva 2000/60/CE, art. 14"
        url: "https://www.chj.es/es-es/ciudadano/participacion_publica/Paginas/Inicioparticipaci%C3%B3np%C3%BAblica.aspx"
      - action: {es: "Avisar a la confederación de un hecho que puede ser una infracción (un vertido, una extracción de agua, una obra en un cauce).", en: "Report to the river basin authority something that may be an offence (a discharge, water abstraction, works in a riverbed)."}
        how: {es: "Escrito a la confederación hidrográfica, por su sede electrónica o registro; ver también la vía general de denuncia.", en: "Written report to the river basin authority, online or at its registry; see also the general reporting route."}
        who: anyone
        legal_basis: "Ley 39/2015, art. 62; Texto refundido de la Ley de Aguas, art. 116.3"
        url: "https://www.chj.es/es-es/ciudadano/tramitesysolicitudes/Paginas/tramitesysolicitudes.aspx"
    general: [access_info, public_comment, report_to_authority, appeal, ngo_action, defensor, sindic, eu_complaint, ep_petition]
    sources:
      - "http://publications.europa.eu/resource/celex/32000L0060"
      - "https://www.boe.es/buscar/act.php?id=BOE-A-2001-14276"
      - "https://www.boe.es/buscar/act.php?id=BOE-A-2007-13182"
      - "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565"
    reviewed_by: "Gaia (Claude), por delegación de Sara"

  - celex: 32006L0118
    eurovoc: ['609']  # EuroVoc concepts of Sara's query of 14 Nov: the sheet without network
    short_name: {es: "Directiva de Aguas Subterráneas", en: "Groundwater Directive"}
    plain:
      es: "Fija cómo se vigila y protege el agua de los acuíferos frente a la contaminación y el deterioro, como parte de los planes hidrológicos."
      en: "Sets how groundwater is monitored and protected against pollution and deterioration, as part of river basin plans."
    in_spain:
      es: "Real Decreto 1514/2009, de protección de las aguas subterráneas contra la contaminación y el deterioro (BOE-A-2009-16772)."
      en: "Royal Decree 1514/2009 on the protection of groundwater against pollution and deterioration (BOE-A-2009-16772)."
    citizen_options:
      - action: {es: "Opinar sobre el estado y las medidas de los acuíferos en la revisión del plan hidrológico.", en: "Comment on groundwater status and measures when the river basin plan is revised."}
        how: {es: "Misma consulta pública que el plan hidrológico, en la confederación.", en: "Same public consultation as the river basin plan, at the basin authority."}
        who: anyone
        legal_basis: "RD 907/2007, art. 74"
        url: "https://www.chj.es/es-es/ciudadano/participacion_publica/Paginas/Inicioparticipaci%C3%B3np%C3%BAblica.aspx"
    general: [access_info, public_comment, report_to_authority, appeal, ngo_action, defensor, sindic, eu_complaint, ep_petition]
    sources:
      - "http://publications.europa.eu/resource/celex/32006L0118"
      - "https://www.boe.es/buscar/act.php?id=BOE-A-2009-16772"
    reviewed_by: "Gaia (Claude), por delegación de Sara"

  - celex: 32020L2184
    eurovoc: ['3144']  # EuroVoc concepts of Sara's query of 14 Nov: the sheet without network
    short_name: {es: "Directiva de Agua de Consumo", en: "Drinking Water Directive"}
    plain:
      es: "Fija la calidad mínima del agua del grifo y obliga a informar a la gente de los resultados de los análisis."
      en: "Sets minimum quality for tap water and requires the results of tests to be made public."
    in_spain:
      es: "Real Decreto 3/2023, de criterios técnico-sanitarios de la calidad del agua de consumo (BOE-A-2023-628), que la incorpora de forma parcial (disposición final quinta)."
      en: "Royal Decree 3/2023 on drinking water quality (BOE-A-2023-628), which partially transposes it (fifth final provision)."
    citizen_options:
      - action: {es: "Consultar los análisis del agua de tu municipio.", en: "Check the test results for your town's water."}
        how: {es: "El ayuntamiento o la empresa del agua los publica en internet antes de 72 horas desde que tiene los análisis; el Ministerio de Sanidad publica un resumen por zona de abastecimiento (SINAC).", en: "The town council or water company publishes them online within 72 hours of receiving the tests; the Ministry of Health publishes a summary by supply area (SINAC)."}
        who: anyone
        legal_basis: "RD 3/2023, art. 63.2 y 63.5"
        url: "https://sinac.sanidad.gob.es/"
    general: [access_info, report_to_authority, appeal, defensor, sindic, eu_complaint, ep_petition]
    sources:
      - "http://publications.europa.eu/resource/celex/32020L2184"
      - "https://www.boe.es/buscar/act.php?id=BOE-A-2023-628"
      - "https://sinac.sanidad.gob.es/"
    reviewed_by: "Gaia (Claude), por delegación de Sara"

  - celex: 32006L0007
    eurovoc: ['3144']  # EuroVoc concepts of Sara's query of 14 Nov: the sheet without network
    short_name: {es: "Directiva de Aguas de Baño", en: "Bathing Water Directive"}
    plain:
      es: "Obliga a vigilar la calidad del agua en playas y zonas de baño y a informar de ella en el propio lugar durante la temporada."
      en: "Requires the water quality at beaches and bathing sites to be monitored and posted on site during the season."
    in_spain:
      es: "Real Decreto 1341/2007, sobre la gestión de la calidad de las aguas de baño (BOE-A-2007-18581)."
      en: "Royal Decree 1341/2007 on bathing water quality management (BOE-A-2007-18581)."
    citizen_options:
      - action: {es: "Consultar la calidad del agua de una playa o zona de baño.", en: "Check the water quality of a beach or bathing site."}
        how: {es: "Información en la propia zona de baño durante la temporada y en la web de las administraciones.", en: "Notice at the bathing site during the season and on public authority websites."}
        who: anyone
        legal_basis: "RD 1341/2007, art. 13"
        url: "https://www.boe.es/buscar/act.php?id=BOE-A-2007-18581"
      - action: {es: "Hacer sugerencias, observaciones o quejas, en especial sobre qué zonas entran en el censo anual de aguas de baño.", en: "Make suggestions, comments or complaints, especially about which sites are listed in the yearly bathing water census."}
        how: {es: "Ante la administración competente (comunidad autónoma o ayuntamiento).", en: "To the competent authority (regional government or town council)."}
        who: anyone
        legal_basis: "RD 1341/2007, art. 15; Ley 27/2006, art. 16"
        url: "https://www.boe.es/buscar/act.php?id=BOE-A-2007-18581"
    general: [access_info, report_to_authority, appeal, defensor, sindic, eu_complaint, ep_petition]
    sources:
      - "http://publications.europa.eu/resource/celex/32006L0007"
      - "https://www.boe.es/buscar/act.php?id=BOE-A-2007-18581"
    reviewed_by: "Gaia (Claude), por delegación de Sara"

  - celex: 32020R0741
    eurovoc: ['141']  # EuroVoc concepts of Sara's query of 14 Nov: the sheet without network
    short_name: {es: "Reglamento de Reutilización del Agua", en: "Water Reuse Regulation"}
    plain:
      es: "Fija la calidad mínima del agua depurada que se vuelve a usar para regar, para que sea segura para las personas y el medio ambiente."
      en: "Sets minimum quality for treated wastewater reused for irrigation, so that it is safe for people and the environment."
    in_spain:
      es: "Se aplica directamente. Lo desarrolla el Real Decreto 1085/2024, Reglamento de reutilización del agua (BOE-A-2024-21701)."
      en: "Directly applicable. Implemented by Royal Decree 1085/2024, Water Reuse Regulation (BOE-A-2024-21701)."
    citizen_options:
      - action: {es: "Opinar sobre los planes de fomento de la reutilización del agua para usos urbanos, obligatorios en las aglomeraciones de más de 50.000 habitantes.", en: "Comment on plans to promote water reuse for urban uses, required in urban areas of more than 50,000 inhabitants."}
        how: {es: "Información pública de un mes, ante la administración que elabora el plan.", en: "One-month public consultation, run by the authority drafting the plan."}
        who: anyone
        legal_basis: "RD 1085/2024, arts. 26.1 y 27.1"
        url: "https://www.boe.es/buscar/act.php?id=BOE-A-2024-21701"
      - action: {es: "Consultar los informes sobre cuánta agua regenerada se usa y con qué calidad.", en: "Read the reports on how much reclaimed water is used and its quality."}
        how: {es: "Informes cada dos años del Ministerio para la Transición Ecológica (Observatorio de la Gestión del Agua).", en: "Two-yearly reports by the Ministry for the Ecological Transition (Water Management Observatory)."}
        who: anyone
        legal_basis: "RD 1085/2024, art. 28.1"
        url: "https://www.boe.es/buscar/act.php?id=BOE-A-2024-21701"
    general: [access_info, report_to_authority, appeal, defensor, sindic, eu_complaint, ep_petition]
    sources:
      - "http://publications.europa.eu/resource/celex/32020R0741"
      - "https://www.boe.es/buscar/act.php?id=BOE-A-2024-21701"
    reviewed_by: "Gaia (Claude), por delegación de Sara"

  - celex: 32021R1119
    eurovoc: ['434786']  # EuroVoc concepts of Sara's query of 14 Nov: the sheet without network
    also_for: [32026R0667]
    short_name: {es: "Ley Europea del Clima", en: "European Climate Law"}
    plain:
      es: "Fija por ley que la UE llegue a cero emisiones netas en 2050 y obliga a la UE y a los países a mejorar su capacidad de adaptarse al cambio del clima."
      en: "Makes it law that the EU reaches net-zero emissions by 2050 and requires the EU and its countries to keep improving their ability to adapt to a changing climate."
    in_spain:
      es: "Se aplica directamente. En España, la Ley 7/2021, de cambio climático y transición energética (BOE-A-2021-8447), regula la adaptación (art. 17 y siguientes); no es una transposición."
      en: "Directly applicable. In Spain, Law 7/2021 on climate change and energy transition (BOE-A-2021-8447) covers adaptation (art. 17 onwards); it is not a transposition."
    citizen_options:
      - action: {es: "Participar en los planes y estrategias contra el cambio climático (por ejemplo, el de adaptación).", en: "Take part in climate plans and strategies (for example, the adaptation plan)."}
        how: {es: "Consultas públicas del Gobierno y de las comunidades autónomas.", en: "Public consultations by the national and regional governments."}
        who: anyone
        legal_basis: "Ley 7/2021, art. 39; Reglamento (UE) 2021/1119, art. 9"
        url: "https://www.boe.es/buscar/act.php?id=BOE-A-2021-8447"
    general: [access_info, public_comment, appeal, ngo_action, defensor, sindic, ep_petition]
    sources:
      - "http://publications.europa.eu/resource/celex/32021R1119"
      - "http://publications.europa.eu/resource/celex/32026R0667"
      - "https://www.boe.es/buscar/act.php?id=BOE-A-2021-8447"
    reviewed_by: "Gaia (Claude), por delegación de Sara"

  - celex: 32024R1991
    eurovoc: ['434786']  # EuroVoc concepts of Sara's query of 14 Nov: the sheet without network
    short_name: {es: "Reglamento de Restauración de la Naturaleza", en: "Nature Restoration Regulation"}
    plain:
      es: "Obliga a cada país a recuperar ecosistemas dañados, incluidos ríos y llanuras aluviales, y a no tener en 2030 menos zonas verdes ni arbolado urbano en total que en 2024."
      en: "Requires each country to restore damaged ecosystems, including rivers and floodplains, and to have no less urban green space or tree cover in total in 2030 than in 2024."
    in_spain:
      es: "Se aplica directamente. España envió a la Comisión Europea el primer borrador de su plan nacional de restauración el 31 de agosto de 2026, tras una consulta pública del 21 de enero al 31 de marzo de 2026. El borrador pasará por evaluación ambiental estratégica, con nuevas fases de participación pública; el plan final está previsto antes del 1 de septiembre de 2027."
      en: "Directly applicable. Spain sent the first draft of its national restoration plan to the European Commission on 31 August 2026, after a public consultation from 21 January to 31 March 2026. The draft will undergo strategic environmental assessment, with new rounds of public participation; the final plan is expected before 1 September 2027."
    citizen_options:
      - action: {es: "Participar en las nuevas fases de consulta del plan nacional de restauración.", en: "Take part in the next consultation rounds on the national restoration plan."}
        how: {es: "Participación pública del Ministerio para la Transición Ecológica en la evaluación ambiental estratégica del borrador; el reglamento exige que sea abierta, transparente, inclusiva y eficaz.", en: "Public participation by the Ministry for the Ecological Transition in the strategic environmental assessment of the draft; the regulation requires it to be open, transparent, inclusive and effective."}
        who: anyone
        legal_basis: "Reglamento (UE) 2024/1991, art. 14.20"
        url: "https://www.miteco.gob.es/es/biodiversidad/temas/ecosistemas-y-conectividad/restauracion-de-la-naturaleza/participacion-consulta-publica.html"
    general: [access_info, public_comment, appeal, ngo_action, defensor, eu_complaint, ep_petition]
    sources:
      - "http://publications.europa.eu/resource/celex/32024R1991"
      - "https://www.miteco.gob.es/es/biodiversidad/temas/ecosistemas-y-conectividad/restauracion-de-la-naturaleza/plan-nacional-de-restauracion.html"
      - "https://www.miteco.gob.es/es/biodiversidad/temas/ecosistemas-y-conectividad/restauracion-de-la-naturaleza/participacion-consulta-publica.html"
    reviewed_by: "Gaia (Claude), por delegación de Sara"

  - celex: 32008L0050
    eurovoc: ['2527']  # EuroVoc concepts of Sara's query of 14 Nov: the sheet without network
    short_name: {es: "Directiva de Calidad del Aire (2008)", en: "Ambient Air Quality Directive (2008)"}
    plain:
      es: "Fija los niveles máximos de contaminantes en el aire, como el dióxido de nitrógeno, y obliga a hacer planes cuando se superan. Queda derogada con efectos a partir del 12 de diciembre de 2026 y la sustituye la Directiva (UE) 2024/2881."
      en: "Sets maximum levels for air pollutants such as nitrogen dioxide and requires plans where they are exceeded. It is repealed from 12 December 2026 and replaced by Directive (EU) 2024/2881."
    in_spain:
      es: "Ley 34/2007, de calidad del aire y protección de la atmósfera (BOE-A-2007-19744), y Real Decreto 102/2011, relativo a la mejora de la calidad del aire (BOE-A-2011-1645). Los planes los aprueban las comunidades autónomas."
      en: "Law 34/2007 on air quality and atmospheric protection (BOE-A-2007-19744) and Royal Decree 102/2011 on air quality improvement (BOE-A-2011-1645). Regional governments approve the plans."
    citizen_options:
      - action: {es: "Consultar los niveles de contaminación del aire medidos en tu zona.", en: "Check the measured air pollution levels in your area."}
        how: {es: "Webs del Ministerio para la Transición Ecológica y de la Generalitat Valenciana; el dióxido de nitrógeno se actualiza al menos cada día.", en: "Websites of the Ministry for the Ecological Transition and the Valencian regional government; nitrogen dioxide is updated at least daily."}
        who: anyone
        legal_basis: "RD 102/2011, art. 28.2"
        url: "https://www.miteco.gob.es/es/calidad-y-evaluacion-ambiental/temas/atmosfera-y-calidad-del-aire/calidad-del-aire.html"
      - action: {es: "Pedir a la administración un plan de calidad del aire o un plan de acción a corto plazo cuando se superan o pueden superarse los límites, y acudir al juez si no lo hace.", en: "Ask the authorities for an air quality plan or a short-term action plan where limits are or may be exceeded, and go to court if they do not act."}
        how: {es: "Petición a la comunidad autónoma; después, recurso contencioso-administrativo. El Tribunal de Justicia de la UE reconoce que las personas directamente afectadas pueden obtener ese plan (C-237/07, Janecek) y que el juez nacional puede ordenar a la administración que lo haga (C-404/13, ClientEarth).", en: "Request to the regional government; then an administrative court appeal. The EU Court of Justice holds that people directly affected can obtain such a plan (C-237/07, Janecek) and that national courts can order the authorities to draw it up (C-404/13, ClientEarth)."}
        who: interested
        legal_basis: "RD 102/2011, arts. 24 y 25; Ley 29/1998, art. 19.1.a; sentencias del TJUE C-237/07 (25-7-2008) y C-404/13 (19-11-2014)"
        url: "https://eur-lex.europa.eu/legal-content/ES/TXT/?uri=CELEX:62007CJ0237"
    general: [access_info, public_comment, report_to_authority, appeal, ngo_action, defensor, sindic, eu_complaint, ep_petition]
    sources:
      - "http://publications.europa.eu/resource/celex/32008L0050"
      - "https://www.boe.es/buscar/act.php?id=BOE-A-2007-19744"
      - "https://www.boe.es/buscar/act.php?id=BOE-A-2011-1645"
      - "http://publications.europa.eu/resource/celex/62007CJ0237"
      - "http://publications.europa.eu/resource/celex/62013CJ0404"
      - "https://agroambient.gva.es/es/web/calidad-ambiental/calidad-del-aire"
    reviewed_by: "Gaia (Claude), por delegación de Sara"

  - celex: 32024L2881
    eurovoc: ['2527']  # EuroVoc concepts of Sara's query of 14 Nov: the sheet without network
    short_name: {es: "Directiva de Calidad del Aire (2024)", en: "Ambient Air Quality Directive (2024)"}
    plain:
      es: "Sustituye a la de 2008 con límites más estrictos para 2030. Añade el derecho a recurrir los planes de calidad del aire y a pedir una indemnización por daños a la salud cuando la administración incumple esos planes con dolo o negligencia."
      en: "Replaces the 2008 directive with stricter limits for 2030. Adds the right to challenge air quality plans in court and to claim compensation for harm to health where the authorities breach those plans intentionally or negligently."
    in_spain:
      es: "Los países deben transponerla a más tardar el 11 de diciembre de 2026 (art. 30). A 14 de noviembre de 2026 no hay en el BOE una norma estatal que la transponga. El Ministerio para la Transición Ecológica ha sometido a información pública un proyecto de real decreto que sustituirá al Real Decreto 102/2011 (del 10 de diciembre de 2025 al 22 de enero de 2026) y un anteproyecto de ley que modifica la Ley 34/2007 en acceso a la justicia (del 4 al 26 de junio de 2026)."
      en: "Member States must transpose it by 11 December 2026 (art. 30). On 14 November 2026 there is no national Spanish law in the BOE transposing it. The Ministry for the Ecological Transition has put out for public consultation a draft royal decree to replace Royal Decree 102/2011 (10 December 2025 to 22 January 2026) and a draft bill amending Law 34/2007 on access to justice (4 to 26 June 2026)."
    citizen_options:
      - action: {es: "Recurrir ante un juez los planes de calidad del aire, los planes a corto plazo o la ubicación y el número de estaciones de medida.", en: "Challenge in court air quality plans, short-term action plans, or the location and number of monitoring stations."}
        how: {es: "Recurso judicial según la ley española que la transponga. La directiva considera suficiente el interés de las ONG de salud o medio ambiente que cumplan los requisitos de la ley nacional.", en: "Court action under the Spanish law that transposes it. The directive treats as sufficient the interest of health and environmental NGOs that meet the requirements of national law."}
        who: interested
        status: {es: "Prevista por la Directiva (UE) 2024/2881; pendiente de la ley española.", en: "Provided for by Directive (EU) 2024/2881; pending Spanish law."}
        legal_basis: "Directiva (UE) 2024/2881, art. 27"
        url: "https://eur-lex.europa.eu/legal-content/ES/TXT/?uri=CELEX:32024L2881"
      - action: {es: "Reclamar una indemnización por daños a la salud cuando la administración incumple con dolo o negligencia los planes de calidad del aire o de acción a corto plazo.", en: "Claim compensation for harm to health where the authorities intentionally or negligently breach air quality or short-term action plans."}
        how: {es: "Ante la administración y los tribunales, según la ley española que la transponga; el plazo para reclamar no empieza a contar mientras dure el incumplimiento.", en: "To the authorities and the courts, under the Spanish law that transposes it; the time limit does not start while the breach continues."}
        who: affected
        status: {es: "Prevista por la Directiva (UE) 2024/2881; pendiente de la ley española.", en: "Provided for by Directive (EU) 2024/2881; pending Spanish law."}
        legal_basis: "Directiva (UE) 2024/2881, art. 28"
        url: "https://eur-lex.europa.eu/legal-content/ES/TXT/?uri=CELEX:32024L2881"
    general: [access_info, public_comment, appeal, ngo_action, defensor, sindic, eu_complaint, ep_petition]
    sources:
      - "http://publications.europa.eu/resource/celex/32024L2881"
      - "https://www.boe.es/buscar/act.php?id=BOE-A-2011-1645"
      - "https://www.boe.es/buscar/act.php?id=BOE-A-2007-19744"
      - "https://www.miteco.gob.es/es/calidad-y-evaluacion-ambiental/participacion-publica/pp-sgpc-2025-cpp-prd.html"
      - "https://www.miteco.gob.es/es/calidad-y-evaluacion-ambiental/participacion-publica/pp-sgpc-2026-ip-apl-rs-aj.html"
