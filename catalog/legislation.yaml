general_options:
  - id: access_info
    action: {es: "Pedir a cualquier administración la información ambiental que tenga (datos, informes, mapas, analíticas).", en: "Ask any public authority for the environmental information it holds (data, reports, maps, test results)."}
    how: {es: "Solicitud a la administración que tiene la información; no hace falta explicar para qué. Debe responder en un mes, o en dos si es voluminosa y lo avisa; si la niega, por escrito y con motivos.", en: "Request to the authority holding the information; no reason needed. It must reply within one month, or two if the request is large and it says so; refusals must be in writing with reasons."}
    who: anyone
    legal_basis: "Ley 27/2006, arts. 3.1.a, 10.2.c y 20"
    url: "https://www.boe.es/buscar/act.php?id=BOE-A-2006-13010"
  - id: public_comment
    action: {es: "Presentar alegaciones cuando un plan o un proyecto sale a información pública.", en: "Submit comments when a plan or project is put out for public consultation."}
    how: {es: "En el plazo del anuncio en el boletín oficial: al menos 45 días hábiles para planes con evaluación ambiental, 30 para proyectos y 20 en general. Quien alega tiene derecho a una respuesta razonada.", en: "Within the period announced in the official gazette: at least 45 working days for plans under environmental assessment, 30 for projects and 20 in general. Those who comment are entitled to a reasoned reply."}
    who: anyone
    legal_basis: "Ley 27/2006, art. 16; Ley 21/2013, arts. 21.2 y 36.1; Ley 39/2015, art. 83"
    url: "https://www.boe.es/buscar/act.php?id=BOE-A-2013-12913"
  - id: report_to_authority
    action: {es: "Poner en conocimiento de la administración un hecho que puede ser una infracción.", en: "Report to the authorities something that may be an offence."}
    how: {es: "Escrito con tu identidad y el relato de los hechos ante el organismo competente (confederación, ayuntamiento, Generalitat). Presentarlo no te convierte, por sí solo, en parte del procedimiento.", en: "Written report with your identity and a description of the facts, to the competent body (river basin authority, town council, regional government). Filing it does not, by itself, make you a party to the proceedings."}
    who: anyone
    legal_basis: "Ley 39/2015, art. 62.1, 62.2 y 62.5"
    url: "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565"
  - id: appeal
    action: {es: "Recurrir una decisión o una falta de actuación de la administración, primero ante ella y después ante el juez.", en: "Appeal a decision or a failure to act, first to the authority and then in court."}
    how: {es: "Recurso administrativo y, después, contencioso-administrativo. Ante el juez hace falta un derecho o interés legítimo; para los derechos de información y participación, la Ley 27/2006 lo reconoce a quien los ve vulnerados.", en: "Administrative appeal, then administrative court. Court action requires a right or legitimate interest; for information and participation rights, Law 27/2006 grants it to anyone whose rights were breached."}
    who: interested
    legal_basis: "Ley 27/2006, art. 20; Ley 29/1998, art. 19.1.a"
    url: "https://www.boe.es/buscar/act.php?id=BOE-A-1998-16718"
  - id: ngo_action
    action: {es: "Recurrir actos u omisiones de la administración que vulneren normas ambientales (acción popular).", en: "Challenge acts or omissions of the authorities that breach environmental law (public interest action)."}
    how: {es: "Solo asociaciones sin ánimo de lucro que protegen el medio ambiente, constituidas hace al menos dos años y activas en el territorio afectado. Tienen asistencia jurídica gratuita.", en: "Only non-profit environmental associations, set up at least two years earlier and active in the affected area. They are entitled to free legal aid."}
    who: ngo
    legal_basis: "Ley 27/2006, arts. 22 y 23"
    url: "https://www.boe.es/buscar/act.php?id=BOE-A-2006-13010"
  - id: defensor
    action: {es: "Presentar una queja al Defensor del Pueblo por la actuación de una administración.", en: "File a complaint with the Spanish Ombudsman about a public authority."}
    how: {es: "Gratis y sin abogado; firmada y en el plazo de un año desde que se conocen los hechos.", en: "Free and without a lawyer; signed, within one year of learning of the facts."}
    who: anyone
    legal_basis: "Ley Orgánica 3/1981, arts. 10 y 15"
    url: "https://www.defensordelpueblo.es/tu-queja/01-description/"
  - id: sindic
    action: {es: "En la Comunitat Valenciana, presentar una queja al Síndic de Greuges por la actuación de la Generalitat o de un ayuntamiento.", en: "In the Valencia region, file a complaint with the Síndic de Greuges about the regional government or a town council."}
    how: {es: "Por escrito, en línea o en persona; gratis y sin abogado; en el plazo de un año.", en: "In writing, online or in person; free and without a lawyer; within one year."}
    who: anyone
    legal_basis: "Ley 2/2021 de la Comunitat Valenciana, arts. 17, 24, 26, 27 y 29"
    url: "https://www.elsindic.com/te-ayudamos/presentar-una-queja-consulta/"
  - id: eu_complaint
    action: {es: "Denunciar ante la Comisión Europea que España no aplica bien una norma de la UE.", en: "Complain to the European Commission that Spain is not applying an EU law correctly."}
    how: {es: "Formulario en línea de la Comisión; gratis y sin demostrar interés. La Comisión decide si abre un procedimiento contra el país; no resuelve casos individuales ni da indemnizaciones, que corresponden a los jueces nacionales.", en: "Commission online form; free and no interest needs to be shown. The Commission decides whether to open proceedings against the country; it does not settle individual cases or award compensation, which is for national courts."}
    who: anyone
    legal_basis: "Art. 258 TFUE; Comunicación de la Comisión 2017/C 18/02, anexo, punto 2"
    url: "https://ec.europa.eu/assets/sg/report-a-breach/complaints_es"
  - id: ep_petition
    action: {es: "Presentar una petición al Parlamento Europeo sobre un asunto de la UE que te afecte directamente.", en: "Petition the European Parliament on an EU matter that directly affects you."}
    how: {es: "Portal de peticiones del Parlamento Europeo o correo postal, en una lengua oficial de la UE, con nombre, nacionalidad y domicilio; para ciudadanos de la UE y residentes en un país de la UE, solos o en grupo.", en: "European Parliament petitions portal or post, in an official EU language, with name, nationality and address; for EU citizens and residents of an EU country, alone or together."}
    who: anyone
    legal_basis: "Art. 227 TFUE"
    url: "https://www.europarl.europa.eu/petitions/es/home"

