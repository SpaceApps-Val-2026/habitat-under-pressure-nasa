# variables: one entry per item. Shape: docs/contratos/catalog.schema.json, property "variables".
# Starting point copied from docs/contratos/examples/catalog.json; build with python -m hup_api.catalog build
- id: population_in_flood_area
  name:
    en: Estimated population within a mapped flood area
    es: Población estimada en un área de inundación cartografiada
  unit: people
  data_class: approximated
  layer: population
  sources: [ine-population, ine, ghsl-built-s, ghsl, copernicus-ems-emsr773, patricova]
  # The reader (readers/exposure.py) counts people at 100 m (INE spread by built-up 100 m, or the GHSL 100 m tile)
  # and only falls back to the 1 km GHSL grid where no tile covers the zone; each result states its own.
  support: {resolution_m: 100}
  # Where it exists depends on the flood maps of read_exposure (operations.yaml, flood_layers): today EMSR773 and
  # PATRICOVA, box [-4.65, 36.63, 0.65, 40.82]. Not declared as a bbox: the exposure tests swap those maps for a
  # synthetic one elsewhere and keep this extent (.dev/notes/2026-11-15-qa-extension-variables.md). The limit says it.
  extent:
    kind: global
    verified: false
    ref: .dev/notes/2026-11-15-qa-extension-variables.md
  frame: exposure
  designs: [exposure]
  answers: [flood exposure, population in a flood area, población expuesta a inundación, habitantes en zona inundable]
  limit:
    en: Population is estimated on the support of the selected source. The map describes spatial exposure only. The only catalogued flood maps are PATRICOVA (Comunitat Valenciana) and the Copernicus EMS activation EMSR773 (October 2024, areas in eastern and southern Spain); elsewhere there is no flood map to count people in.
    es: La población se estima en el soporte de la fuente elegida. El mapa describe exposición espacial. Los únicos mapas de inundación catalogados son PATRICOVA (Comunitat Valenciana) y la activación EMSR773 de Copernicus EMS (octubre de 2024, zonas del este y el sur de España); en el resto no hay mapa en el que contar personas.
  eurovoc:
  - '1440'
