- id: population
  name:
    en: Resident population (INE in Spain, GHSL estimate elsewhere)
    es: Población residente (INE en España, estimación GHSL en el resto)
  unit: people
  data_class: approximated
  layer: population
  sources:
  - ine-population
  - ghsl
  - ghsl-built-s
  limit:
    en: "Where the whole zone lies within INE census sections with a figure (today, the province of Valencia): 1 January 2025; the total of each municipality is the official register figure, each census section keeps its share in the annual census, and inside the section people are spread over 100 m cells by residential built-up surface (GHSL), a modelled split valid for a neighbourhood, not for a building. Elsewhere, the GHSL estimate for 2020 and 2025 on a 100 m grid where the tile is available and a 1 km grid otherwise, spread evenly within each cell; against the register it fell 15% short outside the city of Valencia."
    es: "Donde toda la zona está dentro de secciones censales del INE con cifra (hoy, la provincia de Valencia): 1 de enero de 2025; el total de cada municipio es la cifra oficial del padrón, cada sección censal conserva su parte en el censo anual y, dentro de la sección, la población se reparte en celdas de 100 m según la superficie construida residencial (GHSL), un reparto modelado válido para un barrio, no para un edificio. En el resto, la estimación GHSL de 2020 y 2025 en rejilla de 100 m donde hay tesela y de 1 km en el resto, repartida por igual dentro de cada celda; frente al padrón quedó un 15 % por debajo fuera de la ciudad de Valencia."
  answers:
  - población
  - habitantes
  - cuánta gente vive
  - population
  - inhabitants
  - residents
  not:
    en: "Not the people present at a given hour. Only the total of a whole municipality is an official count; any part of it is a modelled split."
    es: "No es la gente presente a una hora concreta. Solo el total de un municipio entero es una cifra oficial; cualquier parte de él es un reparto modelado."
  support:
    resolution_m: 100
    since: 2020
  extent:
    kind: global
    verified: true
    ref: .dev/notes/2026-11-14-cobertura-geografica-variables.md
  frame: exposure
  designs:
  - state
