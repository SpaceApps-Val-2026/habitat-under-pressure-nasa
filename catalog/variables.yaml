- id: sealed_surface
  data_class: approximated
  name:
    en: Sealed share of the ground (imperviousness)
    es: Fracción de suelo sellado (impermeabilidad)
  unit: '1'
  layer: land
  sources:
  - copernicus-imperviousness
  limit:
    en: "Mean sealed percentage of the 10 m pixels of the zone, divided by 100; each reading also gives the sealed area in m². The percentage of each pixel is estimated from Sentinel-2 images. CLMS only publishes the campaigns of 2006, 2009, 2012 and 2015 (20 m) and 2018, 2021 and 2024 (10 m): there is no map of any other year (for example 2019), and a period without a campaign year has no value. This tool reads the 10 m campaigns 2018, 2021 and 2024, each a status map; CLMS warns that the difference between two status maps also carries technical change (method, variability and noise of the images) and publishes its own change layers for 2018-2021 and 2021-2024 at 20 m and 100 m. CLMS lists 2021 and 2024 as pending validation. Only the EEA38 countries and the United Kingdom."
    es: "Media del porcentaje sellado de los píxeles de 10 m de la zona, dividida por 100; cada lectura da también la superficie sellada en m². El porcentaje de cada píxel se estima con imágenes de Sentinel-2. CLMS solo publica las campañas de 2006, 2009, 2012 y 2015 (20 m) y de 2018, 2021 y 2024 (10 m): no hay mapa de ningún otro año (por ejemplo, 2019), y un periodo sin año de campaña no tiene valor. Esta herramienta lee las campañas de 10 m de 2018, 2021 y 2024, cada una un mapa de estado; CLMS advierte de que la diferencia entre dos mapas de estado también recoge cambio técnico (método, variabilidad y ruido de las imágenes) y publica sus propias capas de cambio 2018-2021 y 2021-2024 a 20 m y 100 m. CLMS da 2021 y 2024 como pendientes de validación. Solo los 38 países de la EEA y el Reino Unido."
  answers:
  - sellado
  - suelo sellado
  - impermeable
  - superficie impermeable
  - impermeabilización
  - sealed
  - sealed soil
  - impervious
  - imperviousness
  not:
    en: "Not a building footprint (built_up_surface): roads, car parks and paved yards count too. It does not tell buildings from roads or any other kind of sealing, and it is not the floor area of a project."
    es: "No es huella de edificio (built_up_surface): también cuentan viales, aparcamientos y patios pavimentados. No distingue edificios de viales ni ningún tipo de sellado de otro, y no es la superficie edificada de un proyecto."
  support:
    resolution_m: 10
    since: 2018
  # EEA SDI record of the 2018 10 m product (EX_GeographicBoundingBox; «EEA38 countries and the United Kingdom»).
  extent:
    kind: bbox
    bbox: [-31.285, 27.642, 44.807, 71.165]
