[project]
name = "hup-api"
version = "0.1.0"
description = "API, executor, assistant, writer, reviewer and library (front B)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "hup-data",
  "hup-ops",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sse-starlette>=2.1",
  "pyyaml>=6",
  "jsonschema>=4.23",
  "openai>=3.51.0",
  "anthropic>=2.8.0",
]

[tool.uv.sources]
hup-data = { workspace = true }
hup-ops = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hup_api"]
